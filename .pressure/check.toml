scope = "repo:containers"

[thresholds]
max_linked_worktrees = 15
max_local_branches = 20
max_target_dir_gib = 8.0

[[checks]]
id = "container_package_and_partial_trace_contracts"
description = "Package declaration checks and partial trace accounting preserve unknowns and authority boundaries"
severity = "error"
require_paths = ["tests/test_container_package.py", "tests/test_trace_v5_partial_accounting.py", ".venv/bin/python"]
command = 'mkdir -p .local/tmp && TMPDIR="$PWD/.local/tmp" PYTHONPATH=src .venv/bin/python -m pytest -q tests/test_container_package.py tests/test_trace_v5_partial_accounting.py'
command_timeout_seconds = 30
remedy = "Restore package refusal/identity checks, partial usage, source-time basis and terminal outcome conformance; use the repo dev environment. Do not waive unknown evidence or runtime admission."

[[checks]]
id = "stream_replay_and_publication_boundaries"
description = "Journal cursors retain scope, prefix integrity, atomic watermarks and explicit storage failure"
severity = "error"
require_paths = ["tests/test_stream_cursor.py", "tests/test_journal_contract_v2.py", ".venv/bin/python"]
command = 'mkdir -p .local/tmp && TMPDIR="$PWD/.local/tmp" PYTHONPATH=src .venv/bin/python -m pytest -q tests/test_stream_cursor.py tests/test_journal_contract_v2.py'
command_timeout_seconds = 30
remedy = "Restore scoped replay, atomic snapshot/chain metadata, close-tail drain and uncertain-write fencing. Do not reset invalid cursors or treat transport EOF as run completion."

[[checks]]
id = "portable_checkpoint_continuation_boundaries"
description = "Portable checkpoints retain byte closure, strict identity, explicit forks and resource unknowns"
severity = "error"
require_paths = ["tests/test_portable_checkpoint.py", ".venv/bin/python"]
command = 'mkdir -p .local/tmp && TMPDIR="$PWD/.local/tmp" PYTHONPATH=src .venv/bin/python -m pytest -q tests/test_portable_checkpoint.py'
command_timeout_seconds = 30
remedy = "Restore complete portable closure, trusted-codec coverage, strict-position selection and explicit child funding. Compatibility must never grant execution authority or reset liabilities."

[[checks]]
id = "release_typing_profiles"
description = "Every source checks against its actual locked core/native or MITM interfaces with zero diagnostics"
severity = "error"
require_paths = ["scripts/check-type-debt.py", ".local/release-types-main/bin/python", ".local/release-types-mitm/bin/python"]
command = 'TMPDIR="$PWD/.local/tmp" .local/release-types-main/bin/python scripts/check-type-debt.py --check-only'
command_timeout_seconds = 30
remedy = "Prepare both locked release typing profiles and fix the source or dependency contract. Do not widen the historical baseline, suppress missing interfaces or lower application crypto requirements."

[[checks]]
id = "trace_semantics_and_crash_retention"
description = "Trace sidecars preserve unknowns and explicit custody; corrupt complete records never become recoverable tails"
severity = "error"
require_paths = ["tests/test_trace_semantics_publication.py", ".local/release-types-main/bin/python"]
command = 'TMPDIR="$PWD/.local/tmp" PYTHONPATH=src .local/release-types-main/bin/python -m pytest -q tests/test_trace_semantics_publication.py'
command_timeout_seconds = 30
remedy = "Restore digest-bound semantic profiles, fsynced prefix retention, immutable repair evidence and compute-free publication/index retry. Never discard corrupt complete records."

[[checks]]
id = "immutable_grading_recovery"
description = "Grading keeps exact subject/rubric identity and reuses committed output after controller/publication failure"
severity = "error"
require_paths = ["tests/test_immutable_grading.py", ".local/release-types-main/bin/python"]
command = 'TMPDIR="$PWD/.local/tmp" PYTHONPATH=src .local/release-types-main/bin/python -m pytest -q tests/test_immutable_grading.py'
command_timeout_seconds = 30
remedy = "Restore evidence sufficiency refusal, immutable V5 judgments, explicit authority/correction and compute-free result publication. Never treat missing evidence as zero or execute submissions on the host."
