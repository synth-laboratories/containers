openapi: 3.1.0
info:
  title: Synth Containers Contract
  version: 0.2.0
  description: |
    Canonical public wire contract for the standardized Synth container runtime.
    It covers metadata discovery, task discovery, blocking and async rollouts,
    rollout lifecycle polling, checkpoints, resume semantics, and control
    surfaces such as pause and terminate.

    v0.2.0 (2026-05-28): RolloutPolicySpec is now a TYPED OpenAI-compatible
    inference target (the "openai contract"), superseding the prior free-form
    {config} bag and the per-container POLICY_* env side-channel. The GEPA
    optimizer sub-contract bumps to `synth_optimizers.gepa.v2`. Credentials are
    referenced via `credential_mode`; raw keys are never carried on the wire.
servers:
  - url: http://localhost
    description: Local development
paths:
  /:
    get:
      operationId: getRoot
      summary: Read root discovery payload
      responses:
        '200':
          description: Discovery payload with health, metadata, and task info
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /health:
    get:
      operationId: getHealth
      summary: Read service health
      responses:
        '200':
          description: Service health payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metadata:
    get:
      operationId: getMetadata
      summary: Read runtime contract metadata
      responses:
        '200':
          description: Runtime metadata payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
  /info:
    get:
      operationId: getInfo
      summary: Alias for metadata
      responses:
        '200':
          description: Runtime metadata payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
  /task_info:
    get:
      operationId: getTaskInfo
      summary: Read task and capability metadata for the active runtime
      parameters:
        - name: seed
          in: query
          required: false
          schema:
            type: integer
          description: Optional seed selector for runtimes with request-aware task info.
        - name: split_group
          in: query
          required: false
          schema:
            type: string
          description: Optional split selector for catalog-backed runtimes.
        - name: family
          in: query
          required: false
          schema:
            type: string
          description: Optional task family selector.
        - name: task_instance_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^.*:(-?\d+)$'
            example: seed:0
          description: Optional concrete task instance selector. Trailing `:` + integer seed.
        - name: task_id
          in: query
          required: false
          schema:
            type: string
          description: Optional task selector.
      responses:
        '200':
          description: Task info payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfoResponse'
  /task_catalog:
    get:
      operationId: getTaskCatalog
      summary: Read task catalog metadata and instances
      responses:
        '200':
          description: Task catalog payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCatalogResponse'
  /program:
    get:
      operationId: getProgram
      summary: Read the runtime program contract
      responses:
        '200':
          description: Program contract payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Runtime does not expose a program contract
  /dataset:
    get:
      operationId: getDataset
      summary: Read runtime dataset metadata
      responses:
        '200':
          description: Dataset contract payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Runtime does not expose dataset metadata
  /dataset/rows:
    post:
      operationId: getDatasetRows
      summary: Fetch concrete dataset rows by split, seeds, and filters
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Dataset rows payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Runtime does not expose dataset rows
  /compatibility:
    get:
      operationId: getCompatibility
      summary: Read consumer compatibility matrix or a target-specific report
      parameters:
        - name: target
          in: query
          required: false
          schema:
            type: string
          description: Optional consumer target, such as go_ex, mipro, or token_rl.
      responses:
        '200':
          description: Compatibility matrix or target-specific report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Unknown or invalid compatibility target
  /rollout:
    post:
      operationId: submitRollout
      summary: Start a rollout using sync or async submission mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloutRequest'
      responses:
        '200':
          description: Rollout completed synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '202':
          description: Rollout accepted asynchronously and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '422':
          description: Request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /rollouts:
    post:
      operationId: submitRolloutAlias
      summary: Alias for rollout submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloutRequest'
      responses:
        '200':
          description: Rollout completed synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '202':
          description: Rollout accepted asynchronously and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '422':
          description: Request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /rollouts/{rollout_id}:
    get:
      operationId: getRollout
      summary: Poll rollout lifecycle state or fetch the final result
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      responses:
        '200':
          description: Rollout lifecycle payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '404':
          description: Rollout not found
  /rollouts/{rollout_id}/state:
    get:
      operationId: getRolloutState
      summary: Read detailed rollout lifecycle/control state
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      responses:
        '200':
          description: Rollout state payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutStateResponse'
        '404':
          description: Rollout not found
  /rollouts/{rollout_id}/summary:
    get:
      operationId: getRolloutSummary
      summary: Read rollout summary metrics
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      responses:
        '200':
          description: Summary payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /rollouts/{rollout_id}/usage:
    get:
      operationId: getRolloutUsage
      summary: Read rollout token or usage metrics
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      responses:
        '200':
          description: Usage payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /rollouts/{rollout_id}/artifacts:
    get:
      operationId: getRolloutArtifacts
      summary: Read rollout artifacts
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      responses:
        '200':
          description: Artifact payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollout_id:
                    type: string
                  artifacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtifactItem'
                additionalProperties: true
  /rollouts/{rollout_id}/events:
    get:
      operationId: getRolloutEvents
      summary: Read a page of the durable rollout event journal
      description: |
        Journal contract v2. Cursor semantics:

        - `after` is the resume token: the page contains sequenced events with
          `sequence > after` (control records are included only when
          `after == 0`). Resuming after a disconnect means re-requesting with
          the last durably processed sequence as `after`.
        - `cursor.next` is the highest sequence on the page (pass it as the
          next `after`); `cursor.has_more` reports a truncated page;
          `cursor.high_water`/`cursor.closed` report the journal head state.
        - `cursor.chain_head` is the per-rollout event hash chain head
          (`synth.rollout.event-chain.v1`) at `cursor.high_water`:
          `genesis = sha256(utf8(rollout_id))` (64 lowercase hex);
          `head(i) = sha256(ascii(head(i-1) + digest(i)))` folding each
          sequenced envelope's 16-hex `digest` in sequence order. The same
          head appears in the `capture.closed` payload (at the evidence
          watermark) and in the lite seal. Consumers that ignore it are
          unaffected.
        - `ack` records the consumer's durably-processed high water. Acks are
          monotonic and clamped to `high_water`; the current ack head is
          echoed as `cursor.acked`.
        - Retention contract (`retention`): the journal and its frame assets
          are retained until `acked >= high_water` after closure OR until
          `ttl_seconds` elapses after closure, whichever comes first;
          `released` reports the decision (deletion is a deployment hook,
          never automatic).
        - `wait_ms` (bounded long-poll, max 10000): the server may hold the
          request until an event newer than `after` arrives, the journal
          closes, or the budget elapses.
      parameters:
        - $ref: '#/components/parameters/RolloutId'
        - name: after
          in: query
          description: Resume token; return sequenced events with sequence > after.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum sequenced events on the page.
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
        - name: ack
          in: query
          description: Consumer's durably-processed high water (monotonic; clamped to high_water).
          schema:
            type: integer
            minimum: 0
        - name: wait_ms
          in: query
          description: Bounded long-poll budget in milliseconds.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        '200':
          description: One journal page with cursor, chain head, and retention state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutEventsPage'
        '404':
          description: Unknown rollout
  /rollouts/{rollout_id}/trace:
    get:
      operationId: getRolloutTrace
      summary: Read rollout trace payload
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      responses:
        '200':
          description: Trace payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /rollouts/{rollout_id}/trace/bundle:
    get:
      operationId: getRolloutTraceBundle
      summary: Read a capture-supervisor Trace V5 bundle archive when one exists
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      responses:
        '200':
          description: Self-contained Trace V5 bundle zip. Absent bundles 404 so Workshop can fall back to the lite seal.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: No capture-supervisor bundle; caller should GET /rollouts/{id}/trace
  /rollouts/{rollout_id}/checkpoints:
    get:
      operationId: listRolloutCheckpoints
      summary: List checkpoints created for a rollout
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      responses:
        '200':
          description: Checkpoint descriptors
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollout_id:
                    type: string
                  checkpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckpointDescriptor'
                additionalProperties: true
    post:
      operationId: createRolloutCheckpoint
      summary: Create a checkpoint for a rollout
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointBody'
      responses:
        '200':
          description: Created checkpoint descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointDescriptor'
  /rollouts/{rollout_id}/checkpoints/{checkpoint_id}:
    get:
      operationId: getRolloutCheckpoint
      summary: Read one checkpoint descriptor for a rollout
      parameters:
        - $ref: '#/components/parameters/RolloutId'
        - $ref: '#/components/parameters/CheckpointId'
      responses:
        '200':
          description: Checkpoint descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointDescriptor'
        '404':
          description: Checkpoint not found
  /checkpoints:
    get:
      operationId: listCheckpoints
      summary: List all checkpoint descriptors visible to the runtime
      responses:
        '200':
          description: Checkpoint descriptors
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckpointDescriptor'
                additionalProperties: true
  /checkpoints/{checkpoint_id}:
    get:
      operationId: getCheckpoint
      summary: Read one checkpoint descriptor by checkpoint id
      parameters:
        - $ref: '#/components/parameters/CheckpointId'
      responses:
        '200':
          description: Checkpoint descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointDescriptor'
        '404':
          description: Checkpoint not found
  /checkpoints/{checkpoint_id}/labels:
    post:
      operationId: updateCheckpointLabels
      summary: Attach or replace labels and annotations for a checkpoint
      parameters:
        - $ref: '#/components/parameters/CheckpointId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointLabelsBody'
      responses:
        '200':
          description: Updated checkpoint descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointDescriptor'
  /rollouts/{rollout_id}/resume:
    post:
      operationId: resumeRollout
      summary: Resume or branch from a checkpoint or prior rollout
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeBody'
      responses:
        '200':
          description: Rollout completed synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '202':
          description: Resumed rollout accepted asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
  /rollouts/{rollout_id}/fork:
    post:
      operationId: forkRollout
      summary: Fork a new rollout branch from a checkpoint or prior rollout
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeBody'
      responses:
        '200':
          description: Forked rollout completed synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '202':
          description: Forked rollout accepted asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
  /rollouts/{rollout_id}/pause:
    post:
      operationId: pauseRollout
      summary: Pause a running rollout when supported
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseBody'
      responses:
        '200':
          description: Updated rollout state payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutStateResponse'
  /rollouts/{rollout_id}/terminate:
    post:
      operationId: terminateRollout
      summary: Terminate or cancel a rollout when supported
      parameters:
        - $ref: '#/components/parameters/RolloutId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateBody'
      responses:
        '200':
          description: Updated rollout state payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutStateResponse'
components:
  parameters:
    RolloutId:
      name: rollout_id
      in: path
      required: true
      schema:
        type: string
    CheckpointId:
      name: checkpoint_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    SubmissionMode:
      type: string
      enum: [sync, async]
    InferenceApiFamily:
      type: string
      description: OpenAI-compatible inference family used to call the model.
      enum: [chat_completions, responses]
      default: chat_completions
    ToolCallStyle:
      type: string
      description: How tool calls are encoded for the model.
      enum: [openai_chat, openai_responses, codex_session_native, none]
      default: none
    ProxyMode:
      type: string
      description: Whether inference must route through the Synth inference proxy.
      enum: [allow_direct, proxy_only, assert_proxy]
      default: allow_direct
    CredentialMode:
      type: string
      description: >-
        How the container obtains the provider credential. Raw keys are never
        sent on the wire: `byok` means the container reads its own env secret;
        `proxy` means inference is routed through the Synth proxy which injects
        credentials.
      enum: [byok, proxy]
      default: byok
    PolicyDisableReasoning:
      type: string
      enum: [auto, "on", "off"]
      default: auto
    RolloutState:
      type: string
      enum: [queued, running, paused, completed, failed, cancelled]
    ResourceKind:
      type: string
      enum:
        - data
        - code
        - runtime
        - state
        - evaluation
        - tooling
        - secret
        - config
        - artifact
        - other
    ResourceRef:
      type: object
      required: [resource_id]
      properties:
        resource_id:
          type: string
        kind:
          $ref: '#/components/schemas/ResourceKind'
        name:
          type: string
        subtype:
          type: string
        uri:
          type: string
        path:
          type: string
        digest:
          type: string
        version:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
        required:
          type: boolean
          default: true
        labels:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          default: ok
        contract_version:
          type: string
      additionalProperties: true
    RolloutEventEnvelope:
      type: object
      description: One journal record (`synth.trace-stream-event.v1`).
      required: [schema, kind, ts, control, payload, digest, event_id]
      properties:
        schema:
          type: string
          enum: [synth.trace-stream-event.v1]
        kind:
          type: string
        ts:
          type: string
        control:
          type: boolean
          description: Control records carry no sequence and never enter the hash chain.
        sequence:
          type: integer
          minimum: 1
          description: Present exactly when control is false.
        event_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        digest:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: Truncated sha256 under digest_schema over {kind, sequence, payload}.
        digest_schema:
          type: string
          enum: [synth.envelope-digest.v2]
          description: >-
            Byte contract used for digest. Omitted only by legacy persisted envelopes.
        rollout_id:
          type: string
      additionalProperties: true
    RolloutEventsCursor:
      type: object
      required: [kind, after, high_water, closed, next, has_more]
      properties:
        kind:
          type: string
          enum: [sequence]
        after:
          type: integer
          minimum: 0
        high_water:
          type: integer
          minimum: 0
        closed:
          type: boolean
        next:
          type: integer
          minimum: 0
          description: Highest sequence on this page; the next request's `after`.
        has_more:
          type: boolean
        chain_head:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Event hash chain head (synth.rollout.event-chain.v1) at
            high_water; genesis sha256(utf8(rollout_id)), extended per
            sequenced event by sha256(ascii(head + digest)).
        acked:
          type: integer
          minimum: 0
          description: The consumer ack head recorded for this rollout.
      additionalProperties: true
    RolloutJournalRetention:
      type: object
      description: >-
        Retention contract state - the journal and frame assets are retained
        until acked >= high_water after closure OR the TTL elapses after
        closure. Deletion is a deployment hook, never automatic.
      required: [policy, ttl_seconds, acked, high_water, closed, released]
      properties:
        policy:
          type: string
          enum: [until-acked-or-ttl]
        ttl_seconds:
          type: integer
          minimum: 1
        acked:
          type: integer
          minimum: 0
        high_water:
          type: integer
          minimum: 0
        closed:
          type: boolean
        released:
          type: boolean
        released_reason:
          type: [string, 'null']
          enum: [acked, ttl_expired, null]
        expires_at:
          type: [string, 'null']
      additionalProperties: true
    RolloutEventsPage:
      type: object
      required: [rollout_id, cursor, events]
      properties:
        rollout_id:
          type: string
        stream_id:
          type: string
        cursor:
          $ref: '#/components/schemas/RolloutEventsCursor'
        retention:
          $ref: '#/components/schemas/RolloutJournalRetention'
        events:
          type: array
          items:
            $ref: '#/components/schemas/RolloutEventEnvelope'
      additionalProperties: true
    GepaOptimizerContract:
      type: object
      description: >-
        GEPA sub-contract advertisement (`synth_optimizers.gepa.v2`). The
        optimizers Rust consumer validates version and absolute routes from
        `metadata.optimizer_contracts.gepa`.
      required: [version]
      properties:
        version:
          type: string
          examples: [synth_optimizers.gepa.v2]
        program_route:
          type: string
        taskset_route:
          type: string
        taskset_tasks_route:
          type: string
        rollout_route:
          type: string
        prepare_route:
          type: string
        trace_route:
          type: string
      additionalProperties: true
    OptimizerContracts:
      type: object
      description: >-
        Optimizer sub-contract advertisements, keyed by contract name.
        Canonical wire location: `metadata.optimizer_contracts`.
      properties:
        gepa:
          $ref: '#/components/schemas/GepaOptimizerContract'
      additionalProperties: true
    InfoCapabilityMetadata:
      type: object
      description: >-
        Runtime readiness, emitted for every runtime family and sourced from
        the runtime's actual state (composed by
        `synth_containers.metadata.compose_metadata_payload`).
      required: [policy_ready, program_ready]
      properties:
        policy_ready:
          type: boolean
          description: The runtime can execute its policy path right now (for hosted-policy runtimes, the required credential is present).
        program_ready:
          type: boolean
          description: The runtime serves a `/program` prompt-program surface.
        grader_ready:
          type: boolean
          description: Present only on runtimes with a distinct scorer role; true when the scorer credential is present.
      additionalProperties: true
    InfoCapabilities:
      type: object
      required: [protocol, contract_version, live_frames, metadata]
      properties:
        protocol:
          type: string
          description: >-
            Protocol id owned by containers. `synth.container.contract.v1`
            for authoring-SDK containers; `synth.container.live-eval.v1`
            for the hosted compat platform.
          examples: [synth.container.live-eval.v1, synth.container.contract.v1]
        contract_version:
          type: string
          description: >-
            Stamped from the single Python constant
            `synth_containers.metadata.METADATA_CONTRACT_VERSION`
            (`synth_containers.ontology.CONTRACT_VERSION`).
          examples: ['2026-05-28']
        operations:
          type: object
          description: Supported operation flags (e.g. `rollouts.prepare`, `reward.get`, `trace_v5.capture`).
          additionalProperties:
            type: boolean
        live_frames:
          type: string
          enum: [native, sampled, post_hoc, unsupported]
          description: Frame-serving capability level for live observation.
        scale_leases:
          type: integer
          minimum: 0
          description: Maximum concurrent rollout leases the instance admits.
        rollout_modes:
          type: array
          items:
            type: string
            enum: [blocking, async]
        metadata:
          $ref: '#/components/schemas/InfoCapabilityMetadata'
        optimizer_contracts:
          allOf:
