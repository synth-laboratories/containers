    RolloutPolicySpec:
      type: object
      description: >-
        Typed OpenAI-compatible inference target for the policy model under
        optimization (the "openai contract"). Supersedes the prior free-form
        {config} bag and the per-container POLICY_* env side-channel. The
        optimizer sends this on every rollout; the container calls the policy
        model with it. Carries `credential_mode`, never a raw API key; the
        secret is resolved by the container env or the Synth inference proxy.
      required: [provider, model]
      properties:
        provider:
          type: string
          description: >-
            Inference provider, such as openai, openrouter, anthropic, groq,
            together, or fireworks. String at this layer; the optimizer
            validates its own closed enum upstream.
        model:
          type: string
        api_family:
          $ref: '#/components/schemas/InferenceApiFamily'
        base_url:
          type: string
          description: OpenAI-compatible base URL; provider default if omitted.
        inference_url:
          type: string
          description: Fully-resolved inference URL when proxied; overrides base_url.
        max_tokens:
          type: integer
        disable_reasoning:
          $ref: '#/components/schemas/PolicyDisableReasoning'
        tool_call_style:
          $ref: '#/components/schemas/ToolCallStyle'
        proxy_mode:
          $ref: '#/components/schemas/ProxyMode'
        credential_mode:
          $ref: '#/components/schemas/CredentialMode'
        config:
          type: object
          additionalProperties: true
          description: >-
            Transitional escape hatch for provider-specific extras during the
            v1 to v2 migration. Prefer the typed fields; this will be removed
            once all containers consume the typed policy.
      additionalProperties: false
    RolloutDatasetSpec:
      type: object
      properties:
        path:
          type: string
        split:
          type: string
        limit:
          type: integer
        config:
          type: object
          additionalProperties: true
      additionalProperties: true
    RolloutActorSpec:
      type: object
      required: [actor_id]
      properties:
