    RolloutRequest:
      type: object
      properties:
        rollout_id:
          type: string
          description: Optional client-supplied rollout identifier. Runtimes may use this as the execution id; otherwise they generate one and return it in the rollout response.
        trace_correlation_id:
          type: string
        trial_id:
          type: string
        run_id:
          type: string
        mode:
          type: string
        submission_mode:
          $ref: '#/components/schemas/SubmissionMode'
        execution:
          type: string
          enum: [background, on_complete]
          description: >
            Async execution mode. Default is background — the rollout progresses
            without POST /complete. on_complete defers simulation until /complete
            so occupancy tests can hold leases.
        idempotency_key:
          type: string
          description: Caller-supplied idempotency key; defaults to rollout_id.
        env:
          $ref: '#/components/schemas/RolloutEnvSpec'
        policy:
