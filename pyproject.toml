[project]
name = "synth-containers"
version = "0.4.5.dev2026102109"
description = "Shared Synth container and environment runtime substrate"
authors = [{name = "Synth Laboratories", email = "josh@usesynth.ai"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSES/*", "NOTICE"]
dependencies = [
    "anyio>=4.14.2",
    "certifi>=2024.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.141.1",
    "starlette>=1.3.1",
    "idna>=3.15",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "websockets>=14.0",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
native-harbor = ["harbor==0.22.0; python_version >= '3.12'"]
native-harbor-docker = [
    "harbor==0.22.0; python_version >= '3.12'",
    "docker==7.1.0; python_version >= '3.12'",
]
native-harbor-daytona = [
    "harbor[daytona]==0.22.0; python_version >= '3.12'",
    "daytona==0.210.0; python_version >= '3.12'",
]
dev = [
    "build>=1.2.1",
    "cryptography>=50.0.0",
    "urllib3>=2.7.0",
    "pytest>=8.0.0",
    "twine>=5.0.0",
    "ruff>=0.6.0",
    "ty==0.0.86",
]

[dependency-groups]
dev = [
    "build>=1.2.1",
    "cryptography>=50.0.0",
    "urllib3>=2.7.0",
    "twine>=5.0.0",
    "ruff>=0.6.0",
    "ty==0.0.86",
    # Contract conformance tests (tests/test_metadata_contract.py) validate the
    # producer-generated golden fixtures against openapi/container-contract-v1.yaml.
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.21.0",
]

release-types = [
    "synth-ai @ git+ssh://git@github.com/synth-laboratories/synth-ai.git@9ab8088abf81cdb42f0897ecbe22c68e8f47485f",
    "harbor[daytona]==0.22.0",
    "docker==7.1.0",
    "daytona==0.210.0",
    "tinker==0.34.0",
    "transformers==5.20.2",
    "renderers==0.1.12",
]

mitm-types = ["ty==0.0.86", "mitmproxy==12.2.3", "pytest>=8.0.0"]

[tool.uv.dependency-groups]
release-types = {requires-python = ">=3.12,<3.15"}
mitm-types = {requires-python = ">=3.12,<3.15"}

[project.scripts]
synth-containers = "synth_containers.cli:main"
synth-trace = "synth_containers.tracing.cli:main"

[project.urls]
Homepage = "https://github.com/synth-laboratories/containers"
Repository = "https://github.com/synth-laboratories/containers"
Issues = "https://github.com/synth-laboratories/containers/issues"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
conflicts = [
    [{group = "mitm-types"}, {group = "dev"}],
    [{group = "mitm-types"}, {extra = "dev"}],
    [{group = "mitm-types"}, {group = "release-types"}],
    [{group = "mitm-types"}, {extra = "native-harbor"}],
    [{group = "mitm-types"}, {extra = "native-harbor-docker"}],
    [{group = "mitm-types"}, {extra = "native-harbor-daytona"}],
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["synth_containers", "synth_containers.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
