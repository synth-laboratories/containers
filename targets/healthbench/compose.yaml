# HealthBench local target. Grader key is passed through, never baked.
name: synth-healthbench

services:
  eval:
    build:
      context: ../..
      dockerfile: targets/healthbench/Dockerfile
    pull_policy: build
    environment:
      SYNTH_CONTAINER_TARGET: healthbench_chat
      SYNTH_CONTAINER_BIND: "0.0.0.0"
      SYNTH_CONTAINER_PORT: "8080"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      HEALTHBENCH_GRADER_BASE_URL: "${HEALTHBENCH_GRADER_BASE_URL:-}"
      HEALTHBENCH_GRADER_MODEL: "${HEALTHBENCH_GRADER_MODEL:-}"
      HEALTHBENCH_GRADER_API_KEY_ENV: "${HEALTHBENCH_GRADER_API_KEY_ENV:-}"
      HEALTHBENCH_POLICY_API_KEY_ENV: "${HEALTHBENCH_POLICY_API_KEY_ENV:-}"
    ports:
      - "127.0.0.1:8114:8080"
    restart: "no"
